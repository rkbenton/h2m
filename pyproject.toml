[project]
name = "h2m"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rebecca Benton", email = "becky@beckybenton.com" }
]
requires-python = ">=3.12"
dependencies = [
    "markdownify>=1.2.2",
    "pyobjc-framework-cocoa>=12.1",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ty.analysis]
# pyobjc builds the names in AppKit dynamically when it is imported and ships no type
# stubs, so ty cannot see NSPasteboard and friends even though they exist at runtime.
# Only AppKit is allowed; every other unresolved import is still reported.
allowed-unresolved-imports = ["AppKit.**"]

[build-system]
requires = ["uv_build>=0.9.26,<0.12"]
build-backend = "uv_build"

[project.scripts]
h2m = "h2m:convert"
